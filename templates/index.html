<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Chat Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-base: #08090d;
            --panel-bg: rgba(13, 15, 23, 0.65);
            --panel-border: rgba(255, 255, 255, 0.07);
            --accent-primary: #6366f1;
            --accent-primary-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dark: #6b7280;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.12), transparent 70%),
                radial-gradient(circle at 0% 100%, rgba(16, 185, 129, 0.03), transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            letter-spacing: -0.01em;
        }

        /* --- Entrance Animations --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulseSoft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }

        /* --- Header Styling --- */
        .header {
            height: 8vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(8, 9, 13, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--panel-border);
            padding: 0 40px;
            box-sizing: border-box;
            animation: fadeIn 1s ease outline;
        }
        
        .header-left {
            display: flex;
            align-items: center;
        }
        
        #digital-clock {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid var(--panel-border);
        }
        
        .header-center {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            justify-content: center;
        }
        
        .header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: transparent;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            background-clip: text;
            margin: 0;
        }
        
        #stream-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-muted);
            max-width: 600px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.02);
            padding: 4px 14px;
            border-radius: 6px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        
        #status-indicator {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #stream-uptime {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        /* --- Main Structure --- */
        .container {
            display: flex;
            flex-wrap: wrap;
            height: 92vh;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            gap: 24px;
        }

        /* --- Bar Chart Component (Top 58%) --- */
        .bar-section {
            width: 100%;
            height: 56%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 40px 120px 20px 120px;
            box-sizing: border-box;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            gap: 24px;
            position: relative;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bar-container {
            width: 110px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }

        .bar {
            width: 100%;
            transition: height 0.6s cubic-bezier(0.25, 1, 0.5, 1), background 0.4s ease, box-shadow 0.4s ease;
            border-radius: 12px 12px 4px 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
        }
        
        .bar-label {
            position: absolute;
            bottom: -32px;
            text-align: center;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-count {
            position: absolute;
            bottom: calc(100% + 10px);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            transition: bottom 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .bar-rank {
            position: absolute;
            top: 14px;
            font-size: 0.9rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.4);
            z-index: 5;
        }

        /* --- Bottom Layout Splits --- */
        .bottom-row-container {
            display: flex;
            width: 100%;
            height: 41%;
            gap: 24px;
        }

        /* --- Bottom Left: Graph --- */
        .graph-section {
            flex: 1;
            height: 100%;
            padding: 24px;
            box-sizing: border-box;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            position: relative;
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- Bottom Right: Chat --- */
        .chat-section {
            width: 420px;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chat-title {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
            color: var(--text-muted);
            text-transform: uppercase;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 12px;
        }

        #chat-box {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            flex: 1;
            font-size: 0.95rem;
            gap: 8px;
        }
        
        .chat-msg {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.01);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: fadeIn 0.3s ease;
        }
        .chat-msg b {
            color: var(--accent-primary);
            font-weight: 600;
            margin-right: 8px;
        }

        .chat-rate-display {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        #current-rate-text {
            font-weight: 700;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 6px;
        }

        /* --- Float Widgets: Team & Fan Leaderboards --- */
        .team-leaderboard {
            position: fixed;
            top: calc(8vh + 40px);
            left: 40px;
            width: 260px;
            background: rgba(11, 12, 18, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 16px;
            box-sizing: border-box;
            z-index: 50;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: fadeIn 1.2s ease;
        }

        .team-leaderboard-title, .fan-leaderboard-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--panel-border);
        }

        .team-lb-table {
            width: 100%;
            border-collapse: collapse;
        }

        .team-lb-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transition: background 0.2s;
        }
        .team-lb-table tr:last-child { border-bottom: none; }

        .team-lb-table td {
            padding: 8px 4px;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .team-lb-rank {
            color: var(--text-dark);
            font-weight: 700;
            width: 28px;
        }
        .team-lb-rank.rank-1 { color: #f59e0b; }
        .team-lb-rank.rank-2 { color: #9ca3af; }
        .team-lb-rank.rank-3 { color: #b45309; }

        .team-lb-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .team-lb-name {
            color: var(--text-main);
            font-weight: 500;
            padding-left: 8px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .team-lb-count {
            color: var(--text-muted);
            font-weight: 600;
            text-align: right;
        }

        .fan-leaderboard {
            position: fixed;
            top: calc(8vh + 40px);
            right: 40px;
            width: 280px;
            background: rgba(11, 12, 18, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 16px;
            box-sizing: border-box;
            z-index: 50;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: fadeIn 1.2s ease;
        }

        .fan-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .fan-row:last-child { border-bottom: none; }

        .fan-rank-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            width: 18px;
            text-align: center;
        }
        .fan-rank-badge.gold   { color: #f59e0b; }
        .fan-rank-badge.silver { color: #9ca3af; }
        .fan-rank-badge.bronze { color: #b45309; }

        .fan-pfp, .fan-pfp-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .fan-info {
            flex: 1;
            overflow: hidden;
        }

        .fan-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fan-count {
            font-size: 0.75rem;
            color: var(--text-dark);
            margin-top: 1px;
        }

        /* --- Channel Status Box --- */
        .channel-widget {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 260px;
            background: rgba(11, 12, 18, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 14px;
            padding: 14px;
            box-sizing: border-box;
            z-index: 50;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .channel-widget-inner {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-pfp, .channel-pfp-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .channel-pfp-placeholder {
            background: rgba(239, 68, 68, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--danger);
            font-size: 0.9rem;
        }

        .channel-info { flex: 1; overflow: hidden; }
        .channel-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .channel-subs {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--danger);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .channel-subs-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--danger);
            display: inline-block;
            animation: pulseSoft 2s infinite;
        }
        .channel-yt-badge {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-dark);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .channel-yt-badge svg { width: 10px; height: 10px; fill: var(--danger); }

        /* --- System Background Ambiance --- */
        #bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at var(--glow-x, 50%) var(--glow-y, 50%), var(--glow-color, transparent) 0%, transparent 60%);
            transition: opacity 1.5s ease;
            opacity: 0;
        }

        /* --- Technical System Overlay Components --- */
        .reconnect-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(8, 9, 13, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 32px 48px;
            display: none;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }
        .reconnect-indicator.active { display: block; }
        .reconnect-spinner {
            border: 2px solid rgba(245, 158, 11, 0.1);
            border-top: 2px solid var(--warning);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Legacy compatibility styles hidden cleanly */
        .flare { display: none !important; }
        #adminPanel { display: none !important; }
    </style>
</head>
<body>

    <div id="bg-glow"></div>

    <!-- Fan Leaderboard Container -->
    <div class="fan-leaderboard" id="fanLeaderboard">
        <div class="fan-leaderboard-title">Top Stream Contributors</div>
        <div id="fan-list">
            <div class="fan-row" style="justify-content:center; color: var(--text-dark); font-size:0.85rem; padding: 12px 0;">Awaiting feed...</div>
        </div>
    </div>

    <!-- Team Metrics Overview -->
    <div class="team-leaderboard" id="teamLeaderboard">
        <div class="team-leaderboard-title">Standings</div>
        <table class="team-lb-table" id="team-lb-body">
            <tr><td style="text-align:center; color: var(--text-dark); font-size:0.85rem; padding: 12px 0;">Awaiting telemetry...</td></tr>
        </table>
    </div>

    <!-- Channel Broadcast Info Widget -->
    <div class="channel-widget" id="channelWidget">
        <div class="channel-widget-inner">
            <div class="channel-pfp-placeholder" id="channel-pfp-wrap">▶</div>
            <div class="channel-info">
                <div class="channel-yt-badge">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><path d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#fff"/></svg>
                    Broadcast Engine
                </div>
                <div class="channel-name" id="channel-name">Connecting...</div>
                <div class="channel-subs" id="channel-subs">
                    <span class="channel-subs-dot"></span>
                    <span id="channel-subs-text">— accounts</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Application Header Wrap -->
    <div class="header">
        <div class="header-left">
            <div id="digital-clock">00:00:00</div>
        </div>
        
        <div class="header-center">
            <h1 id="header-title">Stream Analytics</h1>
            <div id="stream-title">Synchronizing system...</div>
        </div>
        
        <div class="header-right">
            <div id="status-indicator"><span class="channel-subs-dot" style="background:currentColor"></span>OFFLINE</div>
            <div id="stream-uptime">00:00:00</div>
        </div>
    </div>

    <!-- UI Viewport Containers -->
    <div class="container">
        <div class="bar-section" id="bar-wrapper"></div>

        <div class="bottom-row-container">
            <div class="graph-section">
                <canvas id="rateChart"></canvas>
            </div>

            <div class="chat-section">
                <div class="chat-title">Activity Monitor</div>
                <div id="chat-box"></div>
                <div class="chat-rate-display">
                    <span>Frequency Metrics</span>
                    <span><span id="current-rate-text">0</span> msg/s</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Legacy Variable Hook Containers for Internal Stability -->
    <div id="adminPanel">
        <div id="team-inputs"></div>
        <div id="statusMessage" class="status-message"></div>
        <div id="fanStatusMessage" class="status-message"></div>
        <input type="text" id="fan-inject-name">
        <input type="number" id="fan-inject-count" value="0">
        <div id="fan-inject-preview"></div>
    </div>

    <!-- Core Drop Alert Interceptor -->
    <div class="reconnect-indicator" id="reconnectIndicator">
        <div class="reconnect-spinner"></div>
        <div style="font-size: 1.1rem; font-weight: 600; color: var(--text-main);">Re-establishing link</div>
        <div id="reconnectAttempts" style="font-size: 0.85rem; color: var(--text-dark); margin-top: 6px;">Attempt 0/5</div>
    </div>

    <script>
        // --- Core System Parameters ---
        let streamStartTime = null;
        let teams = {};
        let wasConnected = false;
        
        function updateUptime() {
            if (streamStartTime) {
                const elapsed = Math.floor((Date.now() - streamStartTime) / 1000);
                const hours = Math.floor(elapsed / 3600);
                const minutes = Math.floor((elapsed % 3600) / 60);
                const seconds = elapsed % 60;
                document.getElementById('stream-uptime').innerText = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                document.getElementById('stream-uptime').innerText = "00:00:00";
            }
        }
        setInterval(updateUptime, 1000);
        
        function updateClock() {
            const timeString = new Date().toLocaleTimeString('en-US', {
                timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
            document.getElementById('digital-clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Classy Chart.js Configuration Configuration ---
        const ctx = document.getElementById('rateChart').getContext('2d');
        const rateChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Intensity Trend',
                    data: [],
                    borderColor: '#6366f1', 
                    backgroundColor: 'rgba(99, 102, 241, 0.04)',
                    borderWidth: 2,
                    tension: 0.4, 
                    fill: true,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { display: false },
                    y: { 
                        display: true,
                        grid: { color: 'rgba(255, 255, 255, 0.03)', drawBorder: false },
                        ticks: { color: '#4b5563', font: { family: 'Plus Jakarta Sans', size: 11 } },
                        beginAtZero: true
                    }
                },
                plugins: { legend: { display: false } },
                animation: { duration: 0 } 
            }
        });

        // Initialize 8 Visual Target Modules
        const barWrapper = document.getElementById('bar-wrapper');
        for(let i=0; i<8; i++){
            barWrapper.innerHTML += `
            <div class="bar-container">
                <div class="bar-count" id="count-${i}">0</div>
                <div class="bar" id="bar-${i}" style="height: 4%;">
                    <div class="bar-rank" id="rank-${i}"></div>
                    <div class="bar-label" id="label-${i}">-</div>
                </div>
            </div>`;
        }

        function formatSubCount(n) {
            if (!n || n === 0) return '— followers';
            if (n >= 1_000_000) return (n / 1_000_000).toFixed(2) + 'M users';
            if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K users';
            return n.toLocaleString() + ' users';
        }

        async function fetchChannelInfo() {
            try {
                const res = await fetch('/channel_info');
                const data = await res.json();
                document.getElementById('channel-name').innerText = data.name || 'Core Stream';
                document.getElementById('channel-subs-text').innerText = formatSubCount(data.subscribers);
                const wrap = document.getElementById('channel-pfp-wrap');
                if (data.pfp) {
                    wrap.outerHTML = `<img class="channel-pfp" id="channel-pfp-wrap" src="${data.pfp}" onerror="this.outerHTML='<div class=\\'channel-pfp-placeholder\\' id=\\'channel-pfp-wrap\\'>▶</div>'">`;
                }
            } catch(e) { console.warn('Widget synchronization delayed:', e); }
        }
        fetchChannelInfo();
        setInterval(fetchChannelInfo, 300000);

        // Core compatibility functional definitions stubbed cleanly out of standard public rendering frame
        function toggleAdmin() {}
        async function loadTeams() { try { const res = await fetch('/get_teams'); const data = await res.json(); if (data.success) { teams = data.teams; } } catch (e) {} }
        function renderTeamInputs() {}
        async function injectVotes() {}
        async function resetVotes() {}
        function showStatus(message, type) {}
        function showFanStatus(message, type) {}
        function switchTab(tab) {}
        async function injectFanCount() {}
        async function resetFanLeaderboard() {}

        // --- Core Execution Processing ---
        async function fetchData() {
            try {
                const response = await fetch('/data');
                const data = await response.json();

                const statusDiv = document.getElementById('status-indicator');
                const reconnectDiv = document.getElementById('reconnectIndicator');
                
                if(data.status) {
                    statusDiv.innerHTML = `<span class="channel-subs-dot" style="background:${var(--success)}"></span>LIVE`;
                    statusDiv.style.color = "var(--success)";
                    reconnectDiv.classList.remove('active');
                    if (!streamStartTime) { streamStartTime = Date.now(); updateUptime(); }
                    wasConnected = true;
                } else {
                    statusDiv.innerHTML = `<span class="channel-subs-dot" style="background:${var(--warning)}"></span>SYNCING`;
                    statusDiv.style.color = "var(--warning)";
                    if (wasConnected && data.reconnect_attempts > 0) {
                        reconnectDiv.classList.add('active');
                        document.getElementById('reconnectAttempts').innerText = `Attempt ${data.reconnect_attempts}/5`;
                    }
                }
                
                if(data.stream_title) { document.getElementById('stream-title').innerText = data.stream_title; }

                let maxCount = 0;
                data.podium.forEach(p => { if(p.count > maxCount) maxCount = p.count; });
                if (maxCount === 0) maxCount = 10;

                let topTeam = null;
                data.podium.forEach((team, index) => {
                    if (team.rank === 1) topTeam = team;

                    const bar = document.getElementById(`bar-${index}`);
                    const label = document.getElementById(`label-${index}`);
                    const count = document.getElementById(`count-${index}`);
                    const rank = document.getElementById(`rank-${index}`);

                    let heightPerc = (team.count / maxCount) * 100;
                    if(heightPerc < 4) heightPerc = 4; 

                    bar.style.height = `${heightPerc}%`;
                    
                    if(team.name !== "-"){
                        bar.style.background = `linear-gradient(to top, ${team.color}15, ${team.color}60)`;
                        bar.style.borderColor = `${team.color}cc`;
                    } else {
                        bar.style.background = "rgba(255,255,255,0.02)";
                        bar.style.borderColor = "var(--panel-border)";
                    }
                    
                    label.innerText = team.name;
                    count.innerText = team.count;
                    rank.innerText = team.rank !== "-" ? "0" + team.rank : "";
                });

                const teamLbBody = document.getElementById('team-lb-body');
                const allTeams = data.all_teams || [];
                if (allTeams.length === 0) {
                    teamLbBody.innerHTML = '<tr><td style="text-align:center; color:var(--text-dark); padding:16px 0; font-size:0.85rem;">Awaiting telemetry...</td></tr>';
                } else {
                    teamLbBody.innerHTML = allTeams.map(t => {
                        const rankClass = t.rank === 1 ? 'rank-1' : t.rank === 2 ? 'rank-2' : t.rank === 3 ? 'rank-3' : '';
                        return `<tr>
                            <td class="team-lb-rank ${rankClass}">#${t.rank}</td>
                            <td style="width:12px;"><span class="team-lb-dot" style="background:${t.color};"></span></td>
                            <td class="team-lb-name">${t.name}</td>
                            <td class="team-lb-count">${t.count.toLocaleString()}</td>
                        </tr>`;
                    }).join('');
                }

                const bgGlow = document.getElementById('bg-glow');
                if (topTeam && topTeam.name !== "-" && topTeam.count > 0) {
                    bgGlow.style.setProperty('--glow-color', `${topTeam.color}0a`);
                    bgGlow.style.opacity = '1';
                } else {
                    bgGlow.style.opacity = '0';
                }

                const chatBox = document.getElementById('chat-box');
                let chatHtml = "";
                data.chat_history.slice(-10).forEach(msgObj => {
                    chatHtml += `<div class="chat-msg"><b>${msgObj.author}</b>${msgObj.message}</div>`;
                });
                chatBox.innerHTML = chatHtml;

                document.getElementById('current-rate-text').innerText = data.rate_current;

                rateChart.data.labels = data.rate_graph.map(d => d.time);
                rateChart.data.datasets[0].data = data.rate_graph.map(d => d.rate);
                rateChart.update();

                const fanList = document.getElementById('fan-list');
                const chatters = data.top_chatters || [];
                const rankClasses = ['gold', 'silver', 'bronze', '', ''];

                if (chatters.length === 0) {
                    fanList.innerHTML = '<div class="fan-row" style="justify-content:center; color:var(--text-dark); font-size:0.85rem; padding:12px 0;">Awaiting feed...</div>';
                } else {
                    let fanHtml = '';
                    chatters.forEach((chatter, i) => {
                        const pfpHtml = chatter.pfp
                            ? `<img class="fan-pfp" src="${chatter.pfp}" onerror="this.style.display='none'; this.nextSibling.style.display='flex';" /><div class="fan-pfp-placeholder" style="display:none;">${chatter.name.charAt(0).toUpperCase()}</div>`
                            : `<div class="fan-pfp-placeholder">${chatter.name.charAt(0).toUpperCase()}</div>`;

                        fanHtml += `
                        <div class="fan-row">
                            <div class="fan-rank-badge ${rankClasses[i] || ''}">#${i+1}</div>
                            ${pfpHtml}
                            <div class="fan-info">
                                <div class="fan-name">${chatter.name}</div>
                                <div class="fan-count">${chatter.count} units</div>
                            </div>
                        </div>`;
                    });
                    fanList.innerHTML = fanHtml;
                }
            } catch (e) { console.error("Data tracking standard bypass failure:", e); }
        }

        loadTeams();
        setInterval(fetchData, 1000);
    </script>
</body>
</html>
