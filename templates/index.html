<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700;1,900&family=Orbitron:wght@500;600;700;800;900&display=swap');

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            margin: 0;
            padding: 0;
            background: #08080b;
            color: #f2f2f0;
            font-family: 'Titillium Web', sans-serif;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            position: relative;
            background-image:
                repeating-linear-gradient(115deg, rgba(255,255,255,0.014) 0px, rgba(255,255,255,0.014) 1px, transparent 1px, transparent 64px),
                radial-gradient(ellipse 1300px 750px at 50% -12%, rgba(225,6,0,0.07), transparent 60%),
                radial-gradient(ellipse 900px 600px at 100% 100%, rgba(217,164,65,0.045), transparent 60%);
        }

        /* Top racing stripe (signature accent) */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 4px;
            z-index: 500;
            background: linear-gradient(90deg,
                #E10600 0%, #E10600 22%,
                #D9A441 32%, #D9A441 38%,
                #E10600 48%, #E10600 62%,
                #D9A441 72%, #D9A441 78%,
                #E10600 88%, #E10600 100%);
            opacity: 0.9;
        }

        /* --- Header (8% Height) --- */
        .header {
            height: 8vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(19,19,24,0.92) 0%, rgba(9,9,12,0.8) 100%);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 6px 24px rgba(0,0,0,0.45);
            padding: 0 32px;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            animation: fade-down 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes fade-down {
            from { opacity: 0; transform: translateY(-14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #digital-clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #f2f2f0;
            letter-spacing: 2px;
            min-width: 118px;
            text-align: center;
            padding: 7px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
            justify-content: center;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            color: #f7f7f5;
            padding-left: 16px;
            border-left: 4px solid #E10600;
            line-height: 1.1;
        }

        #stream-title {
            font-size: 1.05rem;
            font-weight: 400;
            font-style: normal;
            color: #8d8d96;
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #status-indicator {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 14px 4px 26px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
        }

        #status-indicator::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
            animation: dot-pulse 1.8s ease-in-out infinite;
        }

        @keyframes dot-pulse {
            0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
            50%      { opacity: 0.45; transform: translateY(-50%) scale(0.78); }
        }

        #stream-uptime {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #D9A441;
            text-shadow: 0 0 12px rgba(217, 164, 65, 0.45);
            letter-spacing: 1px;
        }

        /* --- Main Layout --- */
        .container {
            display: flex;
            flex-wrap: wrap;
            height: 92vh;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        /* --- Bar Chart Section --- */
        .bar-section {
            width: 100%;
            height: 60%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 68px;
            padding-left: 120px;
            padding-right: 0px;
            box-sizing: border-box;
            background: radial-gradient(ellipse at center, rgba(40,40,45,0.35) 0%, rgba(0,0,0,0) 70%);
            gap: 16px;
            position: relative;
        }

        .bar-container {
            width: 130px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }

        .bar {
            width: 100%;
            transition: height 0.6s cubic-bezier(0.16,1,0.3,1), background-color 0.5s, box-shadow 0.5s;
            border-top: 1px solid rgba(255,255,255,0.35);

            background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.08) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255,255,255,0.12);
            border-right: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 18px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25);

            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
        }

        .bar-label {
            position: absolute;
            bottom: 12px;
            text-align: center;
            width: 100%;
            font-weight: 700;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 6px black;
            z-index: 10;
        }

        .bar-count {
            position: absolute;
            bottom: calc(100% + 8px);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #f7f7f5;
            text-shadow: 0 0 12px rgba(255,255,255,0.5);
        }

        .bar-rank {
            position: absolute;
            bottom: -42px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ccc;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 4px 12px 4px 18px;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            transition: background 0.4s, color 0.4s, border-color 0.4s;
        }

        .bar-rank:empty { display: none; }

        .bar-rank.gold {
            background: linear-gradient(90deg, #D9A441, #F4C542);
            color: #1a1305;
            border-color: transparent;
            box-shadow: 0 0 14px rgba(244, 197, 66, 0.45);
        }

        .bar-rank.silver {
            background: linear-gradient(90deg, #9a9ca1, #d4d6da);
            color: #16171a;
            border-color: transparent;
            box-shadow: 0 0 12px rgba(198, 201, 206, 0.35);
        }

        .bar-rank.bronze {
            background: linear-gradient(90deg, #a3652c, #cd7f32);
            color: #1a0f04;
            border-color: transparent;
            box-shadow: 0 0 12px rgba(205, 127, 50, 0.35);
        }

        /* --- Bottom Left: Graph --- */
        .graph-section {
            width: 75%;
            height: 40%;
            padding: 22px 26px;
            box-sizing: border-box;
            border-right: 1px solid rgba(255,255,255,0.08);
            border-top: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
            position: relative;
        }

        /* --- Bottom Right: Chat --- */
        .chat-section {
            width: 25%;
            height: 40%;
            background: rgba(10,10,13,0.55);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            padding: 14px 16px;
            box-sizing: border-box;
        }

        .chat-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-bottom: 8px;
            padding-left: 10px;
            color: #d9d9dc;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-left: 3px solid #E10600;
        }

        #chat-box {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            flex: 1;
            font-size: 0.88rem;
            text-shadow: 0 0 2px black;
        }

        .chat-msg {
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.045);
            padding: 2px 0 4px 8px;
            border-left: 2px solid rgba(255,255,255,0.1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-msg b {
            color: #D9A441;
            margin-right: 6px;
            font-weight: 700;
        }

        .chat-msg:last-child {
            animation: msg-in 0.4s cubic-bezier(0.16,1,0.3,1) both;
            border-left-color: #E10600;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateX(-6px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* --- Chat Rate Display --- */
        .chat-rate-display {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8d8d96;
        }

        #current-rate-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #E10600;
            text-shadow: 0 0 10px rgba(225,6,0,0.55);
        }

        /* --- Admin Controls Overlay --- */
        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
            z-index: 1000;
        }

        .admin-toggle:hover {
            background: rgba(225, 6, 0, 0.18);
            border-color: rgba(225, 6, 0, 0.5);
            box-shadow: 0 0 20px rgba(225, 6, 0, 0.35);
        }

        .admin-panel {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(9, 9, 12, 0.94);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(225, 6, 0, 0.3);
            border-radius: 6px;
            padding: 20px;
            width: 400px;
            max-height: 600px;
            overflow-y: auto;
            display: none;
            z-index: 999;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h3 {
            margin-top: 0;
            color: #f2f2f0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #E10600;
            padding-bottom: 10px;
        }

        .vote-inject-form {
            margin-top: 15px;
        }

        .team-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .team-input label {
            min-width: 120px;
            color: #8d8d96;
        }

        .team-input input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 5px 10px;
            color: white;
            font-family: 'Titillium Web', sans-serif;
        }

        .admin-button {
            background: rgba(225, 6, 0, 0.15);
            border: 1px solid #E10600;
            color: #ff6b63;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Titillium Web', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            margin-top: 10px;
            margin-right: 10px;
            transition: all 0.3s;
        }

        .admin-button:hover {
            background: rgba(225, 6, 0, 0.35);
            box-shadow: 0 0 15px rgba(225, 6, 0, 0.4);
        }

        .admin-button.danger {
            background: rgba(255, 51, 51, 0.15);
            border-color: #ff3333;
            color: #ff8f8f;
        }

        .admin-button.danger:hover {
            background: rgba(255, 51, 51, 0.35);
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .status-message.success {
            background: rgba(0, 200, 100, 0.15);
            border: 1px solid #00c864;
            color: #6dffbb;
            display: block;
        }

        .status-message.error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff0000;
            color: #ff8f8f;
            display: block;
        }

        /* Reconnection indicator */
        .reconnect-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(8, 8, 11, 0.96);
            border: 1px solid rgba(255, 149, 0, 0.5);
            border-radius: 6px;
            padding: 30px 40px;
            display: none;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }

        .reconnect-indicator.active {
            display: block;
        }

        .reconnect-spinner {
            border: 3px solid rgba(255, 149, 0, 0.25);
            border-top: 3px solid #ff9500;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- #1 Team Background Glow --- */
        #bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 40% at 50% 0%,   var(--glow-color, transparent) 0%, transparent 70%),
                radial-gradient(ellipse 80% 40% at 50% 100%, var(--glow-color, transparent) 0%, transparent 70%),
                radial-gradient(ellipse 30% 100% at 0% 50%,  var(--glow-color, transparent) 0%, transparent 70%),
                radial-gradient(ellipse 30% 100% at 100% 50%,var(--glow-color, transparent) 0%, transparent 70%);
            transition: --glow-color 1s ease, opacity 1s ease;
            opacity: 0;
        }

        @property --glow-color {
            syntax: '<color>';
            inherits: false;
            initial-value: transparent;
        }

        /* --- Sun Flares --- */
        .flare {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: background-color 1.5s ease, opacity 1.2s ease;
        }

        #flare-1 {
            width: 500px;
            height: 500px;
            filter: blur(90px);
            animation: flare-drift-1 28s ease-in-out infinite;
        }

        #flare-2 {
            width: 280px;
            height: 280px;
            filter: blur(60px);
            animation: flare-drift-2 40s ease-in-out infinite;
        }

        #flare-3 {
            width: 350px;
            height: 350px;
            filter: blur(75px);
            animation: flare-drift-3 52s ease-in-out infinite;
        }

        @keyframes flare-drift-1 {
            0%   { transform: translate(80px, 150px); }
            20%  { transform: translate(1500px, 80px); }
            45%  { transform: translate(1700px, 650px); }
            70%  { transform: translate(600px, 750px); }
            85%  { transform: translate(200px, 400px); }
            100% { transform: translate(80px, 150px); }
        }

        @keyframes flare-drift-2 {
            0%   { transform: translate(1820px, 50px); }
            30%  { transform: translate(900px, 400px); }
            55%  { transform: translate(300px, 800px); }
            80%  { transform: translate(1400px, 700px); }
            100% { transform: translate(1820px, 50px); }
        }

        @keyframes flare-drift-3 {
            0%   { transform: translate(960px, 30px); }
            25%  { transform: translate(1750px, 350px); }
            50%  { transform: translate(1100px, 900px); }
            75%  { transform: translate(150px, 600px); }
            100% { transform: translate(960px, 30px); }
        }

        /* --- Shared Panel Look (Leaderboard / Fan / Channel) --- */
        .fan-leaderboard,
        .team-leaderboard,
        .channel-widget {
            background: rgba(11, 11, 15, 0.68);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 8px 28px rgba(0,0,0,0.4);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
        }

        /* --- Fan Leaderboard Panel --- */
        .fan-leaderboard {
            position: fixed;
            top: calc(8vh + 28px);
            right: 20px;
            width: 232px;
            padding: 14px 15px 16px;
            box-sizing: border-box;
            z-index: 50;
        }

        .fan-leaderboard-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #f2f2f0;
            text-align: left;
            margin-bottom: 11px;
            padding-bottom: 9px;
            padding-left: 9px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-left: 3px solid #D9A441;
        }

        .fan-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            animation: row-in 0.35s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes row-in {
            from { opacity: 0.35; transform: translateY(3px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .fan-row:last-child {
            border-bottom: none;
        }

        .fan-rank-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: #6a6a72;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .fan-rank-badge.gold   {
            color: #1a1305;
            background: linear-gradient(135deg, #F4C542, #D9A441);
            border-color: transparent;
            box-shadow: 0 0 8px rgba(244, 197, 66, 0.5);
        }
        .fan-rank-badge.silver {
            color: #16171a;
            background: linear-gradient(135deg, #e4e6ea, #b9bcc2);
            border-color: transparent;
            box-shadow: 0 0 8px rgba(198, 201, 206, 0.4);
        }
        .fan-rank-badge.bronze {
            color: #1a0f04;
            background: linear-gradient(135deg, #cd7f32, #a3652c);
            border-color: transparent;
            box-shadow: 0 0 8px rgba(205, 127, 50, 0.4);
        }

        .fan-pfp {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.18);
            flex-shrink: 0;
            background: #1a1a1e;
        }

        /* --- Admin Panel Tabs --- */
        .admin-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid rgba(225, 6, 0, 0.25);
        }

        .admin-tab {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #55555c;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .admin-tab:hover {
            color: #aaa;
        }

        .admin-tab.active {
            color: #E10600;
            border-bottom: 2px solid #E10600;
        }

        .fan-pfp-placeholder {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1c1c22, #101014);
            border: 1px solid rgba(255,255,255,0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #8d8d96;
            flex-shrink: 0;
        }

        .fan-info {
            flex: 1;
            overflow: hidden;
        }

        .fan-name {
            font-size: 0.82rem;
            font-weight: 700;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fan-count {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            color: #6a6a72;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* --- Team Leaderboard Table (Top Left) --- */
        .team-leaderboard {
            position: fixed;
            top: calc(8vh + 16px);
            left: 20px;
            width: 218px;
            padding: 12px 13px 9px;
            box-sizing: border-box;
            z-index: 50;
        }

        .team-leaderboard-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #f2f2f0;
            text-align: left;
            margin-bottom: 8px;
            padding-bottom: 7px;
            padding-left: 9px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-left: 3px solid #E10600;
        }

        .team-lb-scroll { overflow: visible; }

        .team-lb-table {
            width: 100%;
            border-collapse: collapse;
        }

        .team-lb-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            animation: row-in 0.35s cubic-bezier(0.16,1,0.3,1) both;
        }

        .team-lb-table tr:last-child {
            border-bottom: none;
        }

        .team-lb-table td {
            padding: 4px 2px;
            font-size: 0.74rem;
            vertical-align: middle;
        }

        .team-lb-rank {
            width: 30px;
            padding-right: 4px !important;
        }

        .rank-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #6a6a72;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 2px 7px 2px 5px;
            min-width: 24px;
            clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
        }

        .rank-chip.rank-1 {
            color: #1a1305;
            background: linear-gradient(90deg, #D9A441, #F4C542);
            border-color: transparent;
            box-shadow: 0 0 6px rgba(244, 197, 66, 0.4);
        }
        .rank-chip.rank-2 {
            color: #16171a;
            background: linear-gradient(90deg, #9a9ca1, #d4d6da);
            border-color: transparent;
        }
        .rank-chip.rank-3 {
            color: #1a0f04;
            background: linear-gradient(90deg, #a3652c, #cd7f32);
            border-color: transparent;
        }

        .team-lb-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            box-shadow: 0 0 4px currentColor;
        }

        .team-lb-name {
            color: #d4d4d8;
            font-weight: 700;
            padding-left: 7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 112px;
        }

        .team-lb-count {
            font-family: 'Orbitron', sans-serif;
            color: #f2f2f0;
            font-weight: 700;
            font-size: 0.76rem;
            text-align: right;
            min-width: 28px;
        }

        .team-lb-empty {
            text-align: center;
            color: #4c4c54;
            font-size: 0.75rem;
            padding: 8px 0;
        }

        /* --- Channel Widget --- */
        .channel-widget {
            position: fixed;
            top: calc(8vh + 28px + 220px);
            right: 20px;
            width: 232px;
            padding: 11px 13px;
            box-sizing: border-box;
            z-index: 50;
            border-color: rgba(225, 6, 0, 0.18) !important;
        }

        .channel-widget-inner {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-pfp {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(225, 6, 0, 0.55);
            flex-shrink: 0;
            background: #17171a;
        }

        .channel-pfp-placeholder {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1c0605, #2c0705);
            border: 2px solid rgba(225, 6, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #ff6b63;
            flex-shrink: 0;
        }

        .channel-info {
            flex: 1;
            overflow: hidden;
        }

        .channel-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-subs {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            color: #ff5b52;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.3px;
        }

        .channel-subs-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff5b52;
            box-shadow: 0 0 5px #ff5b52;
            display: inline-block;
            animation: pulse-red 2s ease-in-out infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .channel-yt-badge {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #5c5c64;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .channel-yt-badge svg {
            width: 10px;
            height: 10px;
            fill: #E10600;
            flex-shrink: 0;
        }

    </style>
</head>
<body>

    <!-- #1 Team Background Glow -->
    <div id="bg-glow"></div>
    <!-- Sun Flares -->
    <div class="flare" id="flare-1"></div>
    <div class="flare" id="flare-2"></div>
    <div class="flare" id="flare-3"></div>

    <!-- Fan Leaderboard -->
    <div class="fan-leaderboard" id="fanLeaderboard">
        <div class="fan-leaderboard-title">Fan Leaderboard</div>
        <div id="fan-list">
            <div class="fan-row" style="justify-content:center; color:#444; font-size:0.8rem; padding: 10px 0;">Waiting for chat...</div>
        </div>
    </div>

    <!-- Team Leaderboard (Top Left) -->
    <div class="team-leaderboard" id="teamLeaderboard">
        <div class="team-leaderboard-title">Teams</div>
        <div class="team-lb-scroll">
            <table class="team-lb-table" id="team-lb-body">
                <tr><td class="team-lb-empty" colspan="4">Waiting for data...</td></tr>
            </table>
        </div>
    </div>

    <!-- Channel Widget (bottom-left corner) -->
    <div class="channel-widget" id="channelWidget">
        <div class="channel-widget-inner">
            <div class="channel-pfp-placeholder" id="channel-pfp-wrap">▶</div>
            <div class="channel-info">
                <div class="channel-yt-badge">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><path d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#fff"/></svg>
                    YouTube
                </div>
                <div class="channel-name" id="channel-name">Loading...</div>
                <div class="channel-subs" id="channel-subs">
                    <span class="channel-subs-dot"></span>
                    <span id="channel-subs-text">— subscribers</span>
                </div>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="header-left">
            <div id="digital-clock">00:00:00</div>
        </div>
        
        <div class="header-center">
            <h1 id="header-title">CHAT SUMMARY</h1>
            <span style="color: #555; font-size: 2rem;">:</span>
            <div id="stream-title">Loading...</div>
        </div>
        
        <div class="header-right">
            <div id="status-indicator">OFFLINE</div>
            <div id="stream-uptime">00:00:00</div>
        </div>
    </div>

    <div class="container">
        <div class="bar-section" id="bar-wrapper">
        </div>

        <div class="graph-section">
            <canvas id="rateChart"></canvas>
        </div>

        <div class="chat-section">
            <div class="chat-title">LIVE CHAT</div>
            <div id="chat-box"></div>
            <div class="chat-rate-display">
                Chat Rate: <span id="current-rate-text" style="margin-left:10px; margin-right:5px;">0</span>/sec
            </div>
        </div>
    </div>

    <!-- Admin inject tools hidden from public (accessible via /admin page only) -->
    <div id="adminPanel" style="display:none;">
        <div id="team-inputs"></div>
        <div id="statusMessage" class="status-message"></div>
        <div id="fanStatusMessage" class="status-message"></div>
        <input type="text" id="fan-inject-name">
        <input type="number" id="fan-inject-count" value="0">
        <div id="fan-inject-preview"></div>
    </div>

    <!-- Reconnection Indicator -->
    <div class="reconnect-indicator" id="reconnectIndicator">
        <div class="reconnect-spinner"></div>
        <div style="font-size: 1.5rem; color: #ff9500;">Reconnecting to chat...</div>
        <div id="reconnectAttempts" style="font-size: 1rem; color: #aaa; margin-top: 10px;">Attempt: 0/5</div>
    </div>

    <script>
        // --- Global Variables ---
        let streamStartTime = null;
        let teams = {};
        let wasConnected = false;
        
        // --- Update Stream Uptime ---
        function updateUptime() {
            if (streamStartTime) {
                const now = Date.now();
                const elapsed = Math.floor((now - streamStartTime) / 1000);
                
                const hours = Math.floor(elapsed / 3600);
                const minutes = Math.floor((elapsed % 3600) / 60);
                const seconds = elapsed % 60;
                
                const timeString = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                document.getElementById('stream-uptime').innerText = timeString;
            } else {
                document.getElementById('stream-uptime').innerText = "00:00:00";
            }
        }
        
        setInterval(updateUptime, 1000);
        
        // --- Digital Clock (Kolkata, India timezone) ---
        function updateClock() {
            const now = new Date();
            const options = {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const timeString = now.toLocaleTimeString('en-US', options);
            document.getElementById('digital-clock').innerText = timeString;
        }
        
        setInterval(updateClock, 1000);
        updateClock();

        // --- Setup Chart.js ---
        const ctx = document.getElementById('rateChart').getContext('2d');
        const rateGradient = ctx.createLinearGradient(0, 0, 0, 300);
        rateGradient.addColorStop(0, 'rgba(225, 6, 0, 0.35)');
        rateGradient.addColorStop(1, 'rgba(225, 6, 0, 0)');
        const rateChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Chat Intensity',
                    data: [],
                    borderColor: '#E10600',
                    backgroundColor: rateGradient,
                    borderWidth: 2.5,
                    tension: 0.4, 
                    pointRadius: 0,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { display: false },
                    y: { 
                        display: true,
                        grid: { color: 'rgba(255,255,255,0.06)' },
                        ticks: { color: '#6a6a72', font: { family: "'Titillium Web', sans-serif" } },
                        beginAtZero: true
                    }
                },
                plugins: { legend: { display: false } },
                animation: { duration: 0 } 
            }
        });

        // --- Generate 8 Bars initially ---
        const barWrapper = document.getElementById('bar-wrapper');
        for(let i=0; i<8; i++){
            let html = `
            <div class="bar-container">
                <div class="bar-count" id="count-${i}">0</div>
                <div class="bar" id="bar-${i}" style="height: 2%; background-color: #333;">
                    <div class="bar-label" id="label-${i}">-</div>
                </div>
                <div class="bar-rank" id="rank-${i}">#</div>
            </div>`;
            barWrapper.innerHTML += html;
        }

        // --- Channel Widget ---
        function formatSubCount(n) {
            if (!n || n === 0) return '— subscribers';
            if (n >= 1_000_000) return (n / 1_000_000).toFixed(2) + 'M subscribers';
            if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K subscribers';
            return n.toLocaleString() + ' subscribers';
        }

        async function fetchChannelInfo() {
            try {
                const res = await fetch('/channel_info');
                const data = await res.json();

                document.getElementById('channel-name').innerText = data.name || 'Channel';
                document.getElementById('channel-subs-text').innerText = formatSubCount(data.subscribers);

                const wrap = document.getElementById('channel-pfp-wrap');
                if (data.pfp) {
                    wrap.outerHTML = `<img class="channel-pfp" id="channel-pfp-wrap" src="${data.pfp}" alt="Channel PFP" onerror="this.outerHTML='<div class=\\'channel-pfp-placeholder\\' id=\\'channel-pfp-wrap\\'>▶</div>'">`;
                }
            } catch(e) {
                console.warn('Channel info fetch failed:', e);
            }
        }

        // Fetch once on load, then refresh every 5 minutes
        fetchChannelInfo();
        setInterval(fetchChannelInfo, 5 * 60 * 1000);

        // --- Admin Panel Functions ---
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('active');
        }

        async function loadTeams() {
            try {
                const response = await fetch('/get_teams');
                const data = await response.json();
                
                if (data.success) {
                    teams = data.teams;
                    renderTeamInputs();
                }
            } catch (e) {
                console.error("Error loading teams", e);
            }
        }

        function renderTeamInputs() {
            const container = document.getElementById('team-inputs');
            container.innerHTML = '';
            
            for (const [teamName, count] of Object.entries(teams)) {
                const div = document.createElement('div');
                div.className = 'team-input';
                div.innerHTML = `
                    <label>${teamName}:</label>
                    <input type="number" id="inject-${teamName.replace(/\s+/g, '-')}" placeholder="0" value="0">
                    <span style="color: #666; font-size: 0.9rem;">(Current: ${count})</span>
                `;
                container.appendChild(div);
            }
        }

        async function injectVotes() {
            const votes = {};
            
            for (const teamName of Object.keys(teams)) {
                const inputId = `inject-${teamName.replace(/\s+/g, '-')}`;
                const value = parseInt(document.getElementById(inputId).value) || 0;
                
                if (value !== 0) {
                    votes[teamName] = value;
                }
            }
            
            if (Object.keys(votes).length === 0) {
                showStatus('No votes to inject', 'error');
                return;
            }
            
            try {
                const response = await fetch('/inject_votes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ votes: votes })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('Votes injected successfully!', 'success');
                    for (const teamName of Object.keys(teams)) {
                        const inputId = `inject-${teamName.replace(/\s+/g, '-')}`;
                        document.getElementById(inputId).value = 0;
                    }
                    setTimeout(loadTeams, 1000);
                } else {
                    showStatus('Error: ' + data.error, 'error');
                }
            } catch (e) {
                showStatus('Network error: ' + e.message, 'error');
            }
        }

        async function resetVotes() {
            if (!confirm('Are you sure you want to reset all votes to 0?')) {
                return;
            }
            
            try {
                const response = await fetch('/reset_votes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('All votes reset!', 'success');
                    setTimeout(loadTeams, 1000);
                } else {
                    showStatus('Error: ' + data.error, 'error');
                }
            } catch (e) {
                showStatus('Network error: ' + e.message, 'error');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = 'status-message ' + type;
            statusDiv.innerText = message;
            setTimeout(() => { statusDiv.className = 'status-message'; }, 5000);
        }

        function showFanStatus(message, type) {
            const statusDiv = document.getElementById('fanStatusMessage');
            statusDiv.className = 'status-message ' + type;
            statusDiv.innerText = message;
            setTimeout(() => { statusDiv.className = 'status-message'; }, 5000);
        }

        function switchTab(tab) {
            document.getElementById('content-votes').style.display = tab === 'votes' ? 'block' : 'none';
            document.getElementById('content-fans').style.display  = tab === 'fans'  ? 'block' : 'none';
            document.getElementById('tab-votes').classList.toggle('active', tab === 'votes');
            document.getElementById('tab-fans').classList.toggle('active',  tab === 'fans');
        }

        async function injectFanCount() {
            const name  = document.getElementById('fan-inject-name').value.trim();
            const count = parseInt(document.getElementById('fan-inject-count').value) || 0;
            if (!name)    { showFanStatus('Enter a username', 'error'); return; }
            if (count === 0) { showFanStatus('Count must not be 0', 'error'); return; }
            try {
                const response = await fetch('/inject_fan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, count })
                });
                const data = await response.json();
                if (data.success) {
                    showFanStatus('Injected ' + name + ' with ' + data.new_total + ' msgs!', 'success');
                    document.getElementById('fan-inject-name').value  = '';
                    document.getElementById('fan-inject-count').value = 0;
                } else { showFanStatus('Error: ' + data.error, 'error'); }
            } catch (e) { showFanStatus('Network error: ' + e.message, 'error'); }
        }

        async function resetFanLeaderboard() {
            if (!confirm('Reset all fan leaderboard counts to 0?')) return;
            try {
                const response = await fetch('/reset_fans', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await response.json();
                if (data.success) { showFanStatus('Fan leaderboard reset!', 'success'); }
                else { showFanStatus('Error: ' + data.error, 'error'); }
            } catch (e) { showFanStatus('Network error: ' + e.message, 'error'); }
        }

        // --- Data Fetch Loop ---
        async function fetchData() {
            try {
                const response = await fetch('/data');
                const data = await response.json();

                const statusDiv = document.getElementById('status-indicator');
                const reconnectDiv = document.getElementById('reconnectIndicator');
                
                if(data.status) {
                    statusDiv.innerText = "● LIVE";
                    statusDiv.style.color = "#00ff00";
                    statusDiv.style.textShadow = "0 0 10px #00ff00";
                    
                    reconnectDiv.classList.remove('active');
                    
                    if (!streamStartTime) {
                        streamStartTime = Date.now();
                        updateUptime();
                    }
                    
                    wasConnected = true;
                } else {
                    statusDiv.innerText = "● CONNECTING...";
                    statusDiv.style.color = "#ff9500";
                    statusDiv.style.textShadow = "0 0 10px #ff9500";
                    
                    if (wasConnected && data.reconnect_attempts > 0) {
                        reconnectDiv.classList.add('active');
                        document.getElementById('reconnectAttempts').innerText = 
                            `Attempt: ${data.reconnect_attempts}/5`;
                    }
                }
                
                if(data.stream_title) {
                    document.getElementById('stream-title').innerText = data.stream_title;
                }

                let maxCount = 0;
                data.podium.forEach(p => { if(p.count > maxCount) maxCount = p.count; });
                if (maxCount === 0) maxCount = 10;

                let topTeam = null;
                data.podium.forEach((team, index) => {
                    if (team.rank === 1) topTeam = team;

                    const bar = document.getElementById(`bar-${index}`);
                    const label = document.getElementById(`label-${index}`);
                    const count = document.getElementById(`count-${index}`);
                    const rank = document.getElementById(`rank-${index}`);

                    let heightPerc = (team.count / maxCount) * 100;
                    if(heightPerc < 2) heightPerc = 2; 

                    bar.style.height = `${heightPerc}%`;
                    bar.style.backgroundColor = team.color;
                    
                    if(team.name !== "-"){
                        bar.style.boxShadow = `0 0 20px ${team.color}80`; 
                    } else {
                        bar.style.boxShadow = "none";
                    }
                    
                    label.innerText = team.name;
                    count.innerText = team.count;
                    rank.innerText = team.rank !== "-" ? "P" + team.rank : "";

                    rank.classList.remove('gold', 'silver', 'bronze');
                    if (team.rank === 1) rank.classList.add('gold');
                    else if (team.rank === 2) rank.classList.add('silver');
                    else if (team.rank === 3) rank.classList.add('bronze');
                });

                const teamLbBody = document.getElementById('team-lb-body');
                const allTeams = data.all_teams || [];
                if (allTeams.length === 0) {
                    teamLbBody.innerHTML = '<tr><td class="team-lb-empty" colspan="4">Waiting for data...</td></tr>';
                } else {
                    teamLbBody.innerHTML = allTeams.map(t => {
                        const rankClass = t.rank === 1 ? 'rank-1' : t.rank === 2 ? 'rank-2' : t.rank === 3 ? 'rank-3' : '';
                        return `<tr>
                            <td class="team-lb-rank"><span class="rank-chip ${rankClass}">P${t.rank}</span></td>
                            <td><span class="team-lb-dot" style="background:${t.color}; color:${t.color};"></span></td>
                            <td class="team-lb-name">${t.name}</td>
                            <td class="team-lb-count">${t.count.toLocaleString()}</td>
                        </tr>`;
                    }).join('');
                }

                const bgGlow = document.getElementById('bg-glow');
                const flare1 = document.getElementById('flare-1');
                const flare2 = document.getElementById('flare-2');
                const flare3 = document.getElementById('flare-3');

                if (topTeam && topTeam.name !== "-" && topTeam.count > 0) {
                    const hex = topTeam.color.replace('#', '');
                    const r = parseInt(hex.substring(0,2), 16);
                    const g = parseInt(hex.substring(2,4), 16);
                    const b = parseInt(hex.substring(4,6), 16);

                    const glowColor   = `rgba(${r}, ${g}, ${b}, 0.18)`;
                    const flare1Color = `rgba(${r}, ${g}, ${b}, 0.22)`;
                    const flare2Color = `rgba(${r}, ${g}, ${b}, 0.16)`;
                    const flare3Color = `rgba(${r}, ${g}, ${b}, 0.12)`;

                    bgGlow.style.setProperty('--glow-color', glowColor);
                    bgGlow.style.opacity = '1';

                    flare1.style.backgroundColor = flare1Color;
                    flare2.style.backgroundColor = flare2Color;
                    flare3.style.backgroundColor = flare3Color;
                    flare1.style.opacity = '1';
                    flare2.style.opacity = '1';
                    flare3.style.opacity = '1';
                } else {
                    bgGlow.style.opacity = '0';
                    flare1.style.opacity = '0';
                    flare2.style.opacity = '0';
                    flare3.style.opacity = '0';
                }

                const chatBox = document.getElementById('chat-box');
                let chatHtml = "";
                data.chat_history.slice(-15).forEach(msgObj => {
                    chatHtml += `<div class="chat-msg"><b>${msgObj.author}:</b> ${msgObj.message}</div>`;
                });
                chatBox.innerHTML = chatHtml;

                document.getElementById('current-rate-text').innerText = data.rate_current;

                const labels = data.rate_graph.map(d => d.time);
                const values = data.rate_graph.map(d => d.rate);
                
                rateChart.data.labels = labels;
                rateChart.data.datasets[0].data = values;
                rateChart.update();

                const fanList = document.getElementById('fan-list');
                const chatters = data.top_chatters || [];
                const rankClasses = ['gold', 'silver', 'bronze', '', ''];
                const rankSymbols = ['1', '2', '3', '4', '5'];

                if (chatters.length === 0) {
                    fanList.innerHTML = '<div class="fan-row" style="justify-content:center; color:#444; font-size:0.8rem; padding: 10px 0;">Waiting for chat...</div>';
                } else {
                    let fanHtml = '';
                    chatters.forEach((chatter, i) => {
                        const pfpHtml = chatter.pfp
                            ? `<img class="fan-pfp" src="${chatter.pfp}" onerror="this.style.display='none'; this.nextSibling.style.display='flex';" /><div class="fan-pfp-placeholder" style="display:none;">${chatter.name.charAt(0).toUpperCase()}</div>`
                            : `<div class="fan-pfp-placeholder">${chatter.name.charAt(0).toUpperCase()}</div>`;

                        fanHtml += `
                        <div class="fan-row">
                            <div class="fan-rank-badge ${rankClasses[i]}">${rankSymbols[i]}</div>
                            ${pfpHtml}
                            <div class="fan-info">
                                <div class="fan-name">${chatter.name}</div>
                                <div class="fan-count">${chatter.count} msgs</div>
                            </div>
                        </div>`;
                    });
                    fanList.innerHTML = fanHtml;
                }

                const previewEl = document.getElementById('fan-inject-preview');
                if (previewEl) {
                    if (chatters.length === 0) {
                        previewEl.innerHTML = '<span style="color:#444;">No chatters yet</span>';
                    } else {
                        previewEl.innerHTML = chatters.map((c, i) =>
                            '<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span>' + (i+1) + '. ' + c.name + '</span><span style="color:#D9A441;">' + c.count + '</span></div>'
                        ).join('');
                    }
                }

            } catch (e) {
                console.error("Error fetching data", e);
            }
        }

        loadTeams();
        setInterval(fetchData, 1000);

    </script>
</body>
</html>
